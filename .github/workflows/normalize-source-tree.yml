---
name: Normalize Spider OS source tree

on:
  push:
    branches:
      - fix/graphical-installer-gate
    paths:
      - '.github/workflows/normalize-source-tree.yml'
      - 'tools/normalize-source-tree.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/normalize-source-tree.yml'
      - 'tools/normalize-source-tree.sh'

permissions:
  contents: write

jobs:
  normalize:
    name: Restore canonical source layout
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: fix/graphical-installer-gate

      - name: Prepare validation tools
        run: python3 -m pip install -q pytest

      - name: Normalize and validate source tree
        run: bash tools/normalize-source-tree.sh

      - name: Commit canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree is already normalized."
            exit 0
          fi
          git config user.name "Spider OS CI"
          git config user.email "spider-os-ci@users.noreply.github.com"
          git commit -m "Normalize Spider OS source tree"
          git push origin HEAD:fix/graphical-installer-gate
