---
name: Normalize Spider OS source tree

on:
  push:
    branches:
      - fix/graphical-installer-gate
    paths:
      - '.github/workflows/normalize-source-tree.yml'

permissions:
  contents: write

jobs:
  normalize:
    name: Restore canonical source layout
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore canonical tree from legacy archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/Spider_OS_v0.7_GitHub_ISO_Ready.zip"
          test -f "$archive"

          extract_root="$RUNNER_TEMP/spider-os-legacy"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          unzip -q "$archive" -d "$extract_root"

          legacy_root=""
          while IFS= read -r containerfile; do
            candidate="$(dirname "$containerfile")"
            if [ -d "$candidate/build_files" ] && \
               [ -d "$candidate/system_files" ] && \
               [ -d "$candidate/src/spider_os" ]; then
              legacy_root="$candidate"
              break
            fi
          done < <(find "$extract_root" -type f -name Containerfile -print)

          if [ -z "$legacy_root" ]; then
            echo "Legacy archive does not contain the expected Spider OS image-template tree." >&2
            exit 1
          fi

          rm -rf build_files system_files src
          cp -a "$legacy_root/build_files" ./build_files
          cp -a "$legacy_root/system_files" ./system_files
          mkdir -p src
          cp -a "$legacy_root/src/spider_os" ./src/spider_os

          # The repository root was previously a flattened export. Overlay every
          # newer text source onto the restored canonical package so the archive
          # contributes only files that were otherwise lost, such as sounds and
          # KDE wallpaper packages.
          install -m 0755 build.sh build_files/build.sh

          python_sources=(
            __init__.py __main__.py actions.py ai.py authority.py cli.py constants.py
            db.py learning.py personal_web.py preload.py proactive.py research.py
            resident.py screen_context.py server.py
          )
          for file in "${python_sources[@]}"; do
            test -f "$file"
            install -m 0644 "$file" "src/spider_os/$file"
          done

          install -d -m 0755 src/spider_os/data src/spider_os/web/assets
          install -m 0644 preload_knowledge.json src/spider_os/data/preload_knowledge.json
          for file in app.js index.html manifest.webmanifest styles.css sw.js; do
            install -m 0644 "$file" "src/spider_os/web/$file"
          done
          install -m 0644 spider-mark.svg src/spider_os/web/assets/spider-mark.svg
          if [ -f spider-original-crimson-distressed.png ]; then
            install -m 0644 spider-original-crimson-distressed.png \
              src/spider_os/web/assets/spider-original-crimson-distressed.png
          fi

          install -d -m 0755 \
            system_files/usr/bin \
            system_files/usr/lib/systemd/user \
            system_files/usr/share/applications \
            system_files/etc/xdg/autostart

          for file in spider-os spider-os-open spider-os-first-login spider-hardware-report spider-security-lab; do
            install -m 0755 "$file" "system_files/usr/bin/$file"
          done
          for file in spider-os.service spider-ai-resident.service; do
            install -m 0644 "$file" "system_files/usr/lib/systemd/user/$file"
          done
          for file in spider-os.desktop spider-hardware-report.desktop spider-security-lab.desktop; do
            install -m 0644 "$file" "system_files/usr/share/applications/$file"
          done
          for file in spider-os-autostart.desktop spider-os-first-login.desktop; do
            install -m 0644 "$file" "system_files/etc/xdg/autostart/$file"
          done

          # Keep the authoritative service and the temporary root mirror aligned.
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacement = 'Environment="SPIDER_AI_WAKE_PHRASES=Hey Webbie;Webbie;Hey Web;Web"'
          for name in (
              Path('spider-ai-resident.service'),
              Path('system_files/usr/lib/systemd/user/spider-ai-resident.service'),
          ):
              text = name.read_text()
              updated, count = re.subn(r'^Environment=.*$', replacement, text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not update wake phrase environment in {name}')
              name.write_text(updated)
          PY

          # Restore the test layout expected by pyproject.toml.
          mkdir -p tests
          for file in test_*.py; do
            [ -f "$file" ] || continue
            install -m 0644 "$file" "tests/$file"
          done

          test -f build_files/build.sh
          test -x build_files/build.sh
          test -f system_files/usr/share/wallpapers/SpiderOS/contents/images/1920x1080.svg
          test -f system_files/usr/share/sounds/SpiderOS/stereo/spider-ai-ready.wav
          test -f src/spider_os/resident.py
          test -f src/spider_os/web/assets/spider-mark.svg
          grep -Fq 'Hey Webbie;Webbie;Hey Web;Web' \
            system_files/usr/lib/systemd/user/spider-ai-resident.service

      - name: Remove stale ZIP fallback from ISO workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-spider-os-iso.yml')
          text = path.read_text()

          pattern = re.compile(
              r'''          project_root="\$GITHUB_WORKSPACE"\n'''
              r'''          if \[ ! -d "\$project_root/build_files" \] \|\| \\\n'''
              r'''.*?'''
              r'''          echo "Using Spider OS source tree: \$project_root"\n''',
              re.S,
          )
          replacement = '''          project_root="$GITHUB_WORKSPACE"\n          required=(\n            build_files/build.sh\n            system_files/usr/lib/systemd/user/spider-ai-resident.service\n            system_files/usr/share/wallpapers/SpiderOS/contents/images/1920x1080.svg\n            src/spider_os/resident.py\n            src/spider_os/web/assets/spider-mark.svg\n          )\n          missing=0\n          for item in "${required[@]}"; do\n            if [ ! -e "$project_root/$item" ]; then\n              echo "Missing canonical Spider OS source: $item" >&2\n              missing=1\n            fi\n          done\n          if [ "$missing" -ne 0 ]; then\n            echo "Refusing to build from a legacy archive fallback." >&2\n            exit 1\n          fi\n          echo "Using canonical Spider OS source tree: $project_root"\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace legacy source-selection block')

          text = text.replace("      - 'Spider_OS_v0.7_GitHub_ISO_Ready.zip'\n", '')
          path.write_text(text)
          PY

          grep -Fq 'Refusing to build from a legacy archive fallback.' \
            .github/workflows/build-spider-os-iso.yml
          if grep -Fq 'unzip -q "$archive"' .github/workflows/build-spider-os-iso.yml; then
            echo "Legacy archive fallback still present." >&2
            exit 1
          fi

      - name: Remove flattened duplicate source files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            __init__.py __main__.py actions.py ai.py authority.py cli.py constants.py \
            db.py learning.py personal_web.py preload.py proactive.py research.py resident.py \
            screen_context.py server.py preload_knowledge.json app.js index.html \
            manifest.webmanifest styles.css sw.js spider-mark.svg build.sh \
            spider-os spider-os-open spider-os-first-login spider-hardware-report \
            spider-security-lab spider-os.service spider-os-autostart.desktop \
            spider-os-first-login.desktop spider-hardware-report.desktop \
            spider-os.desktop spider-security-lab.desktop test_*.py test_database.py.tmp \
            PKG-INFO dependency_links.txt entry_points.txt top_level.txt SOURCES.txt \
            spider-os.dat

          # The service root mirror was deliberately kept only long enough to
          # generate the fixed canonical service above.
          git rm -f --ignore-unmatch spider-ai-resident.service

      - name: Validate normalized repository
        shell: bash
        run: |
          set -euo pipefail
          bash -n build_files/build.sh
          python3 -m compileall -q src/spider_os
          python3 -m pip install -q pytest
          python3 -m pytest -q
          git status --short

      - name: Commit normalized source tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree is already normalized."
            exit 0
          fi
          git config user.name "Spider OS CI"
          git config user.email "spider-os-ci@users.noreply.github.com"
          git commit -m "Normalize Spider OS source tree"
          git push origin HEAD:fix/graphical-installer-gate
