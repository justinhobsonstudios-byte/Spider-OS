---
name: Qualify Spider OS Installer

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Build Spider OS ISO run ID
        required: true
        type: string
  workflow_run:
    workflows:
      - Build Spider OS ISO
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  install-test:
    name: Install, reboot, and verify Web Assembly
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Resolve source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN: ${{ inputs.source_run_id }}
          WORKFLOW_RUN: ${{ github.event.workflow_run.id }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            source_run="$DISPATCH_RUN"
            test -n "$source_run"
            source_sha="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run" --jq .head_sha)"
          else
            source_run="$WORKFLOW_RUN"
            source_sha="$WORKFLOW_SHA"
          fi
          echo "SOURCE_RUN=$source_run" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Install VM test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils socat imagemagick xorriso \
            openssh-client openssl unzip curl

      - name: Download exact candidate ISO
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.name | startswith("Spider-OS-Candidate-"))) | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id" || { echo "No candidate ISO artifact on run $SOURCE_RUN" >&2; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > candidate.zip
          unzip -q candidate.zip -d candidate
          cp candidate/Spider_OS_x86_64.iso ./Spider_OS_x86_64.iso
          sha256sum -c candidate/Spider_OS_x86_64.iso.sha256

      - name: Install candidate and verify Spider OS session
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          chmod +x tools/test-installer-e2e.sh
          tools/test-installer-e2e.sh Spider_OS_x86_64.iso qualification-evidence

      - name: Print qualification diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "## Spider OS installer qualification" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Source build run: $SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualification outcome: ${{ steps.qualify.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          for file in \
            qualification-evidence/web-assembly-diagnostics.txt \
            qualification-evidence/installed-verification.txt \
            qualification-evidence/installed-serial.log \
            qualification-evidence/installer-serial.log; do
            if [ -s "$file" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              echo "### $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 250 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done

      - name: Upload qualification evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spider-OS-Qualification-${{ env.SOURCE_SHA }}
          path: qualification-evidence/
          if-no-files-found: warn
          retention-days: 1
