---
name: Smoke Test Spider OS ISO

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Spider OS ISO
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  boot-test:
    name: Boot Spider OS ISO in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Decide whether smoke test applies
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          run_smoke=true
          reason="manual smoke request"
          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$SOURCE_CONCLUSION" != success ]; then
              run_smoke=false
              reason="source build concluded $SOURCE_CONCLUSION"
            elif [ "$SOURCE_BRANCH" != main ] && [ "$SOURCE_EVENT" != workflow_dispatch ]; then
              run_smoke=false
              reason="source build came from $SOURCE_EVENT on $SOURCE_BRANCH and published no ISO artifact"
            else
              reason="successful ISO-producing source build"
            fi
          fi
          echo "run=$run_smoke" >> "$GITHUB_OUTPUT"
          echo "Smoke decision: $run_smoke ($reason)"

      - name: Free runner disk space
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install VM tools
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils socat imagemagick xorriso cpio xz-utils unzip mtools
          qemu-system-x86_64 --version

      - name: Resolve Spider OS ISO artifact
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          api_headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          source_run="$WORKFLOW_RUN_ID"
          if [ "$EVENT_NAME" != workflow_run ]; then
            source_run="$(curl --fail --silent --location "${api_headers[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/build-spider-os-iso.yml/runs?branch=main&status=success&per_page=1" | jq -r '.workflow_runs[0].id // empty')"
          fi
          test -n "$source_run"
          artifact_json="$(curl --fail --silent --location "${api_headers[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$source_run/artifacts?name=Spider-OS-ISO&per_page=100")"
          artifact_id="$(jq -r '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty' <<<"$artifact_json")"
          artifact_digest="$(jq -r '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .digest // empty' <<<"$artifact_json")"
          test -n "$artifact_id"
          echo "SOURCE_RUN_ID=$source_run" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIGEST=$artifact_digest" >> "$GITHUB_ENV"

      - name: Download completed Spider OS ISO artifact
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Spider-OS-ISO.zip"
          mkdir -p "$GITHUB_WORKSPACE/iso"
          curl --fail --location --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" --output "$archive"
          if [[ "$ARTIFACT_DIGEST" == sha256:* ]]; then echo "${ARTIFACT_DIGEST#sha256:}  $archive" | sha256sum --check; fi
          unzip -q "$archive" -d "$GITHUB_WORKSPACE/iso"
          rm -f "$archive"
          iso_path="$(find "$GITHUB_WORKSPACE/iso" -type f -name '*.iso' -print -quit)"
          test -f "$iso_path"
          echo "ISO_PATH=$iso_path" >> "$GITHUB_ENV"
          sha256sum "$iso_path"

      - name: Verify and diagnose installer media
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/iso"
          xorriso -indev "$ISO_PATH" -report_el_torito plain 2>&1 | tee "$evidence/el-torito.txt"
          grep -Eq 'BIOS[[:space:]]+y' "$evidence/el-torito.txt"
          grep -Eq 'UEFI[[:space:]]+y' "$evidence/el-torito.txt"
          xorriso -indev "$ISO_PATH" -pvd_info 2>&1 | tee "$evidence/pvd.txt"
          grep -Fq "Volume id    : 'SPIDER_OS'" "$evidence/pvd.txt"
          xorriso -indev "$ISO_PATH" -report_system_area plain 2>&1 | tee "$evidence/system-area.txt"
          xorriso -indev "$ISO_PATH" -find / -type f -print 2>/dev/null | sort > "$evidence/iso-files.txt"
          grep -E '/(images/pxeboot/(vmlinuz|initrd.img)|LiveOS/|images/install.img)' "$evidence/iso-files.txt" || true
          initrd="$RUNNER_TEMP/initrd.img"
          xorriso -osirrox on -indev "$ISO_PATH" -extract /images/pxeboot/initrd.img "$initrd" >/dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/buildstamp-check"
          (cd "$RUNNER_TEMP/buildstamp-check"; xz -dc "$initrd" | cpio -id --quiet '.buildstamp')
          grep -Fq 'Product = Spider OS' "$RUNNER_TEMP/buildstamp-check/.buildstamp"
          grep -Fq 'Version = 0.7.0' "$RUNNER_TEMP/buildstamp-check/.buildstamp"
          cp "$RUNNER_TEMP/buildstamp-check/.buildstamp" "$evidence/buildstamp.txt"

      - name: Boot ISO and require installer progress
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/iso"
          disk="$RUNNER_TEMP/spider-test.qcow2"
          monitor="$RUNNER_TEMP/qemu-monitor.sock"
          serial="$evidence/serial.log"
          qemu-img create -f qcow2 "$disk" 32G
          accel_args=(-accel 'tcg,thread=multi' -cpu max)
          accel_name='tcg,thread=multi'
          wait_seconds=420
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            accel_args=(-accel kvm -cpu host)
            accel_name='kvm'
            wait_seconds=240
          fi
          echo "Using QEMU acceleration: $accel_name; final installer gate at ${wait_seconds}s"
          qemu-system-x86_64 -machine q35 "${accel_args[@]}" -m 4096 -smp 2 -boot order=d -cdrom "$ISO_PATH" -drive "file=$disk,format=qcow2,if=virtio" -display none -monitor "unix:$monitor,server=on,wait=off" -serial "file:$serial" -no-reboot -daemonize
          for i in $(seq 1 30); do [ -S "$monitor" ] && break; sleep 1; done
          test -S "$monitor"
          elapsed=0
          for target in 30 90 180 "$wait_seconds"; do
            sleep $((target - elapsed)); elapsed="$target"
            [ -S "$monitor" ] || { echo "QEMU monitor vanished at ${target}s" >&2; exit 1; }
            printf 'screendump %s\n' "$evidence/spider-boot-${target}s.ppm" | socat - "UNIX-CONNECT:$monitor"
          done
          printf 'info status\n' | socat - "UNIX-CONNECT:$monitor" | tee "$evidence/qemu-status.txt"
          grep -Fq 'VM status: running' "$evidence/qemu-status.txt"
          if grep -Eqi 'kernel panic|entering emergency mode|dracut.*emergency shell|failed to mount.*sysroot' "$serial"; then
            echo 'Fatal boot condition detected.' >&2; cat "$serial" >&2; exit 1
          fi
          for ppm in "$evidence"/spider-boot-*.ppm; do
            png="${ppm%.ppm}.png"; convert "$ppm" "$png"; rm -f "$ppm"
            colors="$(convert "$png" -format '%k' info:)"; echo "$(basename "$png"): $colors colors"
            [ "$colors" -gt 1 ] || { echo "Blank/monochrome VM display" >&2; exit 1; }
          done
          final="$evidence/spider-boot-${wait_seconds}s.png"
          colors="$(convert "$final" -format '%k' info:)"
          entropy="$(convert "$final" -format '%[entropy]' info:)"
          echo "Final screen: colors=$colors entropy=$entropy"
          python3 - "$colors" "$entropy" <<'PY'
import sys
colors=int(sys.argv[1]); entropy=float(sys.argv[2])
if colors < 32 or entropy < 0.08:
    raise SystemExit('Graphical installer not proven by final screen')
PY
          printf 'quit\n' | socat - "UNIX-CONNECT:$monitor" || true
          echo 'Spider OS reached a visually complex installer display and remained running.'

      - name: Upload boot-test evidence
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spider-OS-Boot-Test
          path: |
            iso/spider-boot-*.png
            iso/serial.log
            iso/qemu-status.txt
            iso/el-torito.txt
            iso/pvd.txt
            iso/system-area.txt
            iso/iso-files.txt
            iso/buildstamp.txt
          if-no-files-found: warn
          retention-days: 1
