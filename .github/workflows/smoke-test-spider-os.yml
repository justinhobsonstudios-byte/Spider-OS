---
name: Validate minimal installer source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce the milestone 1 boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            Containerfile
            build_files/build.sh
            disk_config/iso-kde.toml
            tools/repair-installer-iso.sh
            tools/test-minimal-installer-e2e.sh
            system_files/usr/share/wallpapers/SpiderOS/metadata.json
            system_files/usr/share/wallpapers/SpiderOS/contents/images/1920x1080.svg
          )
          for path in "${required[@]}"; do
            test -e "$path"
          done
          bash -n build_files/build.sh
          bash -n tools/repair-installer-iso.sh
          bash -n tools/test-minimal-installer-e2e.sh
          grep -Fq 'systemctl set-default graphical.target' build_files/build.sh
          grep -Fq 'systemctl enable plasmalogin.service' build_files/build.sh
          if grep -Eiq 'webbie|web assembly|spider-os\.service|spider-ai-resident'             Containerfile build_files/build.sh tools/test-minimal-installer-e2e.sh; then
            echo "Milestone 1 must not depend on application or Web Assembly services." >&2
            exit 1
          fi
