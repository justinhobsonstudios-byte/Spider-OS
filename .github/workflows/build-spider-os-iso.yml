---
name: Test minimal Spider OS installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Containerfile
      - 'build_files/**'
      - 'system_files/**'
      - 'disk_config/**'
      - 'tools/**'
      - '.github/workflows/build-spider-os-iso.yml'
  pull_request:
    branches: [main]
    paths:
      - Containerfile
      - 'build_files/**'
      - 'system_files/**'
      - 'disk_config/**'
      - 'tools/**'
      - '.github/workflows/build-spider-os-iso.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: minimal-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-e2e:
    name: Install, reboot, reach KDE login
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             podman xorriso cpio xz-utils qemu-system-x86 qemu-utils socat             imagemagick openssh-client openssl
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Validate production inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Containerfile
          test -f build_files/build.sh
          test -f disk_config/iso-kde.toml
          test -f tools/repair-installer-iso.sh
          test -f tools/test-minimal-installer-e2e.sh
          bash -n build_files/build.sh
          bash -n tools/repair-installer-iso.sh
          bash -n tools/test-minimal-installer-e2e.sh

      - name: Build bootc image
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build --pull=newer             --build-arg BASE_IMAGE=ghcr.io/ublue-os/aurora:stable             --file Containerfile             --tag localhost/spider-os-minimal:latest .
          sudo podman run --rm localhost/spider-os-minimal:latest bootc container lint

      - name: Publish ephemeral image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spider-os:minimal-${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io             --username "$GITHUB_ACTOR" --password-stdin
          sudo podman push localhost/spider-os-minimal:latest "$image_ref"
          echo "SPIDER_IMAGE=$image_ref" >> "$GITHUB_ENV"
          echo "RUNNER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "RUNNER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build production installer ISO
        id: build-iso
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/iso-kde.toml
          image: ${{ env.SPIDER_IMAGE }}
          chown: ${{ env.RUNNER_UID }}:${{ env.RUNNER_GID }}
          rootfs: btrfs
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Repair installer metadata
        shell: bash
        env:
          BUILT_ISO: ${{ steps.build-iso.outputs.anaconda-iso-output-path }}
        run: |
          set -euo pipefail
          iso_path="$BUILT_ISO"
          if [ -z "$iso_path" ] || [ ! -f "$iso_path" ]; then
            iso_path="$(find "$GITHUB_WORKSPACE/output" -type f -name '*.iso' -print -quit)"
          fi
          test -n "$iso_path"
          test -f "$iso_path"
          chmod +x tools/repair-installer-iso.sh
          tools/repair-installer-iso.sh "$iso_path" Spider_OS_x86_64.iso

      - name: Install to blank disk and verify KDE login
        id: gate
        timeout-minutes: 130
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/test-minimal-installer-e2e.sh
          tools/test-minimal-installer-e2e.sh             Spider_OS_x86_64.iso iso-e2e-evidence

      - name: Summarize gate
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          {
            echo "## Minimal installer gate"
            echo
            echo "- Outcome: **$GATE_OUTCOME**"
            echo "- Required: real install, disk-only reboot, graphical.target, Plasma Login Manager"
            echo "- Excluded: Spider services, Webbie, Web Assembly"
            if [ -s iso-e2e-evidence/installed-verification.txt ]; then
              echo
              echo '~~~text'
              tail -n 120 iso-e2e-evidence/installed-verification.txt
              echo '~~~'
            elif [ -s iso-e2e-evidence/installed-diagnostics.txt ]; then
              echo
              echo '~~~text'
              tail -n 160 iso-e2e-evidence/installed-diagnostics.txt
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimal-installer-failure
          path: iso-e2e-evidence/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload verified ISO
        if: ${{ steps.gate.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spider-OS-ISO
          path: Spider_OS_x86_64.iso
          compression-level: 0
          retention-days: 1

      - name: Remove ephemeral image
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$GITHUB_REPOSITORY_OWNER"
          tag="minimal-${GITHUB_SHA}"
          version_id="$(gh api --paginate             "/users/$owner/packages/container/spider-os/versions?per_page=100"             --jq ".[] | select((.metadata.container.tags // []) | index(\"$tag\")) | .id"             | head -n 1)"
          if [ -n "$version_id" ]; then
            gh api --method DELETE               "/users/$owner/packages/container/spider-os/versions/$version_id"
          fi
