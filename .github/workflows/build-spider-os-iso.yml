---
name: Build Spider OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild/spider-os-foundation
    paths:
      - 'Containerfile'
      - 'build_files/**'
      - 'system_files/**'
      - 'src/**'
      - 'tests/**'
      - 'disk_config/**'
      - '.github/workflows/build-spider-os-iso.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'build_files/**'
      - 'system_files/**'
      - 'src/**'
      - 'tests/**'
      - 'disk_config/**'
      - '.github/workflows/build-spider-os-iso.yml'

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: spider-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-and-iso:
    name: Build immutable image and installer ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          required=(
            Containerfile
            build_files/build.sh
            disk_config/iso-kde.toml
            src/spider_os/__init__.py
            src/spider_os/resident.py
            system_files/usr/lib/systemd/user/spider-os.service
            system_files/usr/lib/systemd/user/spider-ai-resident.service
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "Missing canonical source: $path" >&2; exit 1; }
          done
          bash -n build_files/build.sh
          while IFS= read -r script; do bash -n "$script"; done < <(find system_files -type f -name '*.sh' -print)
          python3 -m compileall -q src/spider_os
          PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Build Spider OS bootc image
        shell: bash
        env:
          SPIDER_BASE_IMAGE: ghcr.io/ublue-os/aurora:stable
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=newer \
            --build-arg "BASE_IMAGE=$SPIDER_BASE_IMAGE" \
            --file Containerfile \
            --tag localhost/spider-os:${GITHUB_SHA} \
            .
          sudo podman run --rm localhost/spider-os:${GITHUB_SHA} bootc container lint

      - name: Publish ephemeral image for ISO builder
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image_ref="$registry/spider-os:ci-${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo podman push localhost/spider-os:${GITHUB_SHA} "$image_ref"
          echo "SPIDER_IMAGE=$image_ref" >> "$GITHUB_ENV"
          echo "RUNNER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "RUNNER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build installer ISO
        id: bib
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/iso-kde.toml
          image: ${{ env.SPIDER_IMAGE }}
          chown: ${{ env.RUNNER_UID }}:${{ env.RUNNER_GID }}
          rootfs: btrfs
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Preserve builder ISO unchanged
        shell: bash
        env:
          BUILT_ISO: ${{ steps.bib.outputs.anaconda-iso-output-path }}
        run: |
          set -euo pipefail
          iso="$BUILT_ISO"
          if [ -z "$iso" ] || [ ! -f "$iso" ]; then
            iso="$(find output -type f -name '*.iso' -print -quit)"
          fi
          test -n "$iso"
          test -f "$iso"
          cp --reflink=auto "$iso" Spider_OS_x86_64.iso
          sha256sum Spider_OS_x86_64.iso > Spider_OS_x86_64.iso.sha256

      - name: Validate installer structure
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
          test -s Spider_OS_x86_64.iso
          xorriso -indev Spider_OS_x86_64.iso -pvd_info | tee iso-structure.txt
          xorriso -indev Spider_OS_x86_64.iso -report_el_torito plain | tee -a iso-structure.txt
          xorriso -indev Spider_OS_x86_64.iso -find / -maxdepth 3 -type f -exec echo | tee -a iso-structure.txt
          grep -F 'SPIDER_OS' iso-structure.txt
          grep -Ei 'El Torito|boot' iso-structure.txt >/dev/null
          ls -lh Spider_OS_x86_64.iso Spider_OS_x86_64.iso.sha256

      # Cache is the exact-run CI handoff. Artifact publication is optional and
      # must not block qualification when the repository artifact quota is full.
      - name: Cache exact candidate for qualification
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Spider_OS_x86_64.iso
            Spider_OS_x86_64.iso.sha256
            iso-structure.txt
          key: spider-os-candidate-${{ github.run_id }}-${{ github.sha }}

      - name: Publish downloadable candidate ISO (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spider-OS-Candidate-${{ github.sha }}
          path: |
            Spider_OS_x86_64.iso
            Spider_OS_x86_64.iso.sha256
            iso-structure.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove ephemeral CI image
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$GITHUB_REPOSITORY_OWNER"
          package="spider-os"
          tag="ci-${GITHUB_SHA}"
          version_id="$(gh api --paginate "/users/$owner/packages/container/$package/versions?per_page=100" --jq ".[] | select((.metadata.container.tags // []) | index(\"$tag\")) | .id" | head -n 1)"
          if [ -n "$version_id" ]; then
            gh api --method DELETE "/users/$owner/packages/container/$package/versions/$version_id"
          fi
  qualify-installer:
    name: Install, reboot, and verify Web Assembly
    needs: image-and-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install VM test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils socat imagemagick xorriso \
            openssh-client openssl unzip curl

      - name: Restore exact candidate from qualification cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Spider_OS_x86_64.iso
            Spider_OS_x86_64.iso.sha256
            iso-structure.txt
          key: spider-os-candidate-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Verify exact candidate checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s Spider_OS_x86_64.iso
          test -s Spider_OS_x86_64.iso.sha256
          sha256sum -c Spider_OS_x86_64.iso.sha256

      - name: Install candidate and verify Spider OS session
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          chmod +x tools/test-installer-e2e.sh
          tools/test-installer-e2e.sh Spider_OS_x86_64.iso qualification-evidence

      - name: Print qualification diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "## Spider OS installer qualification" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Build run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualification outcome: ${{ steps.qualify.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          for file in \
            qualification-evidence/web-assembly-diagnostics.txt \
            qualification-evidence/installed-verification.txt \
            qualification-evidence/installed-serial.log \
            qualification-evidence/installer-serial.log; do
            if [ -s "$file" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              echo "### $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 250 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done

      - name: Upload qualification failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spider-OS-Qualification-${{ github.sha }}
          path: qualification-evidence/
          if-no-files-found: warn
          retention-days: 1
