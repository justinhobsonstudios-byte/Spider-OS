---
name: Build Spider OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'build-image.sh'
      - 'build-iso.sh'
      - 'build_files/**'
      - 'system_files/**'
      - 'src/**'
      - 'disk_config/**'
      - 'tools/**'
      - '.github/workflows/build-spider-os-iso.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'build-image.sh'
      - 'build-iso.sh'
      - 'build_files/**'
      - 'system_files/**'
      - 'src/**'
      - 'disk_config/**'
      - 'tools/**'
      - '.github/workflows/build-spider-os-iso.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: spider-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build bootable installer
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure build tools
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for command in podman unzip xorriso cpio xz qemu-system-x86_64 qemu-img socat convert ssh ssh-keygen openssl; do
            command -v "$command" >/dev/null 2>&1 || missing=1
          done
          if [ "$missing" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              podman \
              unzip \
              xorriso \
              cpio \
              xz-utils \
              qemu-system-x86 \
              qemu-utils \
              socat \
              imagemagick \
              openssh-client \
              openssl
          fi
          podman --version
          xorriso -version | head -n 1

      - name: Select Spider OS source tree
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE"
          required=(
            build_files/build.sh
            system_files/usr/lib/systemd/user/spider-ai-resident.service
            system_files/usr/share/wallpapers/SpiderOS/contents/images/1920x1080.svg
            system_files/usr/share/sounds/SpiderOS/stereo/spider-ai-ready.wav
            src/spider_os/resident.py
            src/spider_os/web/assets/spider-mark.svg
          )
          missing=0
          for item in "${required[@]}"; do
            if [ ! -e "$project_root/$item" ]; then
              echo "Missing canonical Spider OS source: $item" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to build without the canonical Spider OS source tree." >&2
            exit 1
          fi
          echo "Using canonical Spider OS source tree: $project_root"
          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Containerfile"
          test -f "$GITHUB_WORKSPACE/disk_config/iso-kde.toml"
          test -f "$GITHUB_WORKSPACE/tools/repair-installer-iso.sh"
          test -f "$GITHUB_WORKSPACE/tools/test-installer-e2e.sh"
          test -d "$PROJECT_ROOT/build_files"
          test -d "$PROJECT_ROOT/system_files"
          test -d "$PROJECT_ROOT/src/spider_os"
          test -d "$PROJECT_ROOT/tests"
          bash -n "$GITHUB_WORKSPACE/tools/repair-installer-iso.sh"
          bash -n "$GITHUB_WORKSPACE/tools/test-installer-e2e.sh"
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find "$PROJECT_ROOT" -type f -name '*.sh' -print)
          python3 -m compileall -q "$PROJECT_ROOT/src/spider_os"
          PYTHONPATH="$PROJECT_ROOT/src" python3 -m unittest discover \
            -s "$PROJECT_ROOT/tests" -v

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Build Spider OS bootc image
        shell: bash
        env:
          SPIDER_BASE_IMAGE: ghcr.io/ublue-os/aurora:stable
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=newer \
            --build-arg "BASE_IMAGE=$SPIDER_BASE_IMAGE" \
            --file "$GITHUB_WORKSPACE/Containerfile" \
            --tag localhost/spider-os:latest \
            "$PROJECT_ROOT"
          sudo podman run --rm localhost/spider-os:latest bootc container lint

      - name: Publish image for ISO builder
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image_ref="$registry/spider-os:ci-${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo podman push localhost/spider-os:latest "$image_ref"
          echo "SPIDER_IMAGE=$image_ref" >> "$GITHUB_ENV"
          echo "RUNNER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "RUNNER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build installer ISO
        id: build-iso
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/iso-kde.toml
          image: ${{ env.SPIDER_IMAGE }}
          chown: ${{ env.RUNNER_UID }}:${{ env.RUNNER_GID }}
          rootfs: btrfs
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Repair Spider OS installer metadata
        shell: bash
        env:
          BUILT_ISO: ${{ steps.build-iso.outputs.anaconda-iso-output-path }}
        run: |
          set -euo pipefail
          iso_path="$BUILT_ISO"
          if [ -z "$iso_path" ] || [ ! -f "$iso_path" ]; then
            iso_path="$(find "$GITHUB_WORKSPACE/output" -type f -name '*.iso' -print -quit)"
          fi
          if [ -z "$iso_path" ] || [ ! -f "$iso_path" ]; then
            echo "bootc-image-builder completed without producing an ISO." >&2
            find "$GITHUB_WORKSPACE/output" -maxdepth 4 -type f -print >&2 || true
            exit 1
          fi
          chmod +x "$GITHUB_WORKSPACE/tools/repair-installer-iso.sh"
          "$GITHUB_WORKSPACE/tools/repair-installer-iso.sh" \
            "$iso_path" \
            "$GITHUB_WORKSPACE/Spider_OS_x86_64.iso"

      - name: Install, reboot, and verify Web Assembly
        shell: bash
        timeout-minutes: 130
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/iso-e2e-evidence"
          mkdir -p "$evidence"
          chmod +x "$GITHUB_WORKSPACE/tools/inspect-installer-boot.sh"
          chmod +x "$GITHUB_WORKSPACE/tools/test-installer-e2e.sh"
          "$GITHUB_WORKSPACE/tools/inspect-installer-boot.sh" \
            "$GITHUB_WORKSPACE/Spider_OS_x86_64.iso" \
            "$evidence/boot-diagnostics.txt"
          "$GITHUB_WORKSPACE/tools/test-installer-e2e.sh" \
            "$GITHUB_WORKSPACE/Spider_OS_x86_64.iso" \
            "$evidence"

      - name: Upload full-install evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spider-OS-Install-Test
          path: iso-e2e-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare ISO artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f Spider_OS_x86_64.iso
          sha256sum Spider_OS_x86_64.iso > Spider_OS_x86_64.iso.sha256
          ls -lh Spider_OS_x86_64.iso Spider_OS_x86_64.iso.sha256

      - name: Upload Spider OS ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spider-OS-ISO
          path: |
            Spider_OS_x86_64.iso
            Spider_OS_x86_64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
