name: Cleanup Spider OS CI storage

on:
  push:
    branches:
      - ops/cleanup-spider-storage-20260830
    paths:
      - .github/workflows/cleanup-spider-storage.yml

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  cleanup:
    name: Finish Spider OS storage cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DELETE_ITEMS: "false"
      PACKAGE_NAME: spider-os
      RUN_TO_CANCEL: "33301317292"
    steps:
      - name: Inventory and clean disposable storage
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$RUN_TO_CANCEL" ]; then
            echo "Canceling accidental full build run $RUN_TO_CANCEL"
            gh api --method POST \
              "/repos/$OWNER/$REPO/actions/runs/$RUN_TO_CANCEL/cancel" || true
          fi

          artifact_count=0
          artifact_bytes=0
          while IFS=$'\t' read -r artifact_id artifact_size artifact_created; do
            [ -n "$artifact_id" ] || continue
            artifact_count=$((artifact_count + 1))
            artifact_bytes=$((artifact_bytes + artifact_size))
            echo "Disposable ISO artifact: id=$artifact_id bytes=$artifact_size created=$artifact_created"
            if [ "$DELETE_ITEMS" = true ]; then
              gh api --method DELETE \
                "/repos/$OWNER/$REPO/actions/artifacts/$artifact_id"
            fi
          done < <(
            gh api --paginate \
              "/repos/$OWNER/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "Spider-OS-ISO") | [.id, .size_in_bytes, .created_at] | @tsv'
          )
          echo "Disposable ISO artifacts: $artifact_count ($artifact_bytes bytes)"

          package_count=0
          package_listing="$RUNNER_TEMP/spider-package-versions.tsv"
          package_error="$RUNNER_TEMP/spider-package-error.txt"
          if gh api --paginate \
            "/users/$OWNER/packages/container/$PACKAGE_NAME/versions?per_page=100" \
            --jq '.[] | select((.metadata.container.tags | length) == 0 or all(.metadata.container.tags[]; startswith("ci-"))) | [.id, ((.metadata.container.tags // []) | join(",")), .created_at] | @tsv' \
            > "$package_listing" 2> "$package_error"; then
            while IFS=$'\t' read -r version_id version_tags version_created; do
              [ -n "$version_id" ] || continue
              package_count=$((package_count + 1))
              echo "Disposable container version: id=$version_id tags=${version_tags:-<untagged>} created=$version_created"
              if [ "$DELETE_ITEMS" = true ]; then
                gh api --method DELETE \
                  "/users/$OWNER/packages/container/$PACKAGE_NAME/versions/$version_id"
              fi
            done < "$package_listing"
          else
            echo "Unable to inventory container versions:" >&2
            cat "$package_error" >&2
            exit 1
          fi
          echo "Disposable container versions: $package_count"

          if [ "$DELETE_ITEMS" = true ]; then
            echo "Cleanup complete. GitHub may take 6-12 hours to recalculate storage usage."
          else
            echo "Dry inventory complete; nothing was deleted."
          fi
