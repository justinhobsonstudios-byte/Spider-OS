name: Clean Actions artifacts

on:
  push:
    paths:
      - ".github/workflows/cleanup-artifacts.yml"
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Keep artifacts newer than this many days; 0 deletes all artifacts"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  packages: write

jobs:
  cleanup:
    name: Remove disposable Actions artifacts
    runs-on: ubuntu-latest
    env:
      SCHEDULE_KEEP_DAYS: "3"
    steps:
      - name: Restore in-progress ISO image
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.packages.restorePackageVersionForUser({
              username: context.repo.owner,
              package_type: "container",
              package_name: "spider-os",
              package_version_id: 1240681982,
            });
            core.notice("Restored GHCR version #1240681982 for the in-progress ISO build.");

      - name: Delete expired and old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const requested = core.getInput("keep_days") || process.env.SCHEDULE_KEEP_DAYS;
            const keepDays = Number.parseInt(requested, 10);
            if (!Number.isInteger(keepDays) || keepDays < 0) {
              core.setFailed("keep_days must be a non-negative integer");
              return;
            }

            const cutoff = keepDays === 0
              ? Number.POSITIVE_INFINITY
              : Date.now() - keepDays * 24 * 60 * 60 * 1000;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {owner: context.repo.owner, repo: context.repo.repo, per_page: 100}
            );

            let deleted = 0;
            let bytes = 0;
            for (const artifact of artifacts) {
              const created = Date.parse(artifact.created_at);
              if (!artifact.expired && created >= cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
              bytes += artifact.size_in_bytes || 0;
              core.info(`Deleted ${artifact.name} (#${artifact.id}, ${artifact.size_in_bytes || 0} bytes)`);
            }
            core.notice(`Deleted ${deleted} artifact(s), freeing approximately ${bytes} bytes.`);

      - name: Delete disposable GHCR CI versions
        uses: actions/github-script@v7
        with:
          script: |
            const requested = core.getInput("keep_days") || process.env.SCHEDULE_KEEP_DAYS;
            const keepDays = Number.parseInt(requested, 10);
            if (!Number.isInteger(keepDays) || keepDays < 0) {
              core.setFailed("keep_days must be a non-negative integer");
              return;
            }

            const cutoff = keepDays === 0
              ? Number.POSITIVE_INFINITY
              : Date.now() - keepDays * 24 * 60 * 60 * 1000;
            const username = context.repo.owner;
            const packageName = "spider-os";
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                username,
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              }
            );

            let deleted = 0;
            for (const version of versions) {
              const tags = version.metadata?.container?.tags || [];
              const isCiVersion = tags.length > 0 && tags.every((tag) => tag.startsWith("ci-"));
              const created = Date.parse(version.created_at);
              if (!isCiVersion || (keepDays !== 0 && created >= cutoff)) continue;

              await github.rest.packages.deletePackageVersionForUser({
                username,
                package_type: "container",
                package_name: packageName,
                package_version_id: version.id,
              });
              deleted += 1;
              core.info(`Deleted GHCR version #${version.id} (${tags.join(", ")})`);
            }
            core.notice(`Deleted ${deleted} disposable GHCR CI version(s).`);
